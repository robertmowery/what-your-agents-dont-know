# Cloud Build: build the context server image and push it to Artifact Registry.
# _IMAGE is passed on the command line (see Dockerfile); nothing here names a project.
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "context_server/Dockerfile", "-t", "${_IMAGE}", "."]
images:
  - ${_IMAGE}
options:
  logging: CLOUD_LOGGING_ONLY
