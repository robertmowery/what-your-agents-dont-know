# Checks that every metric in the semantic layer returns what the Part 1 gold
# SQL returns. Run with: python -m tessaway.layers.semantic --check-gold
#
# A case with `question` is compared with that question's gold SQL in
# questions/part1.yaml, under the question's own tolerance. A case with
# `reference_sql` covers a metric no question asks for directly; its reference
# is a piece of the gold SQL, copied here, and must match to the cent.
#
# Agents never see this file. It is also how the harness knows which questions
# the semantic layer could have answered with one metric query (the bypass count).

- question: M1
  request: {metrics: [on_time_rate], start_date: "2026-09-01", end_date: "2026-09-30"}
  answer_column: on_time_rate

