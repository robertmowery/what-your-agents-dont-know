- id: E1
  question: Who was our largest customer by revenue in Q3 2026?
  gold_sql_v2: |
    WITH fx AS (
      SELECT eff_mo_dt, fx_rt FROM ref_fx_rate
      WHERE from_curr_cd = 'CAD' AND to_curr_cd = 'USD'
    ),
    dlv AS (
      -- revenue version 2: each load's delivery date, at the final delivery stop on the local clock
      SELECT load_id, DATE(arr_ts, tz_nm) AS dlvr_dt
      FROM tms_stop
      WHERE stop_typ_cd = 'DL'
      QUALIFY ROW_NUMBER() OVER (PARTITION BY load_id ORDER BY stop_seq DESC) = 1
    ),
    rev_doc AS (
      -- invoices and credit memos in the period their load was delivered (version 2);
      -- canceled-load fees in the period of the fee date; amounts in US dollars at the
      -- rate for the month of the document, as in version 1
      SELECT i.load_id, d.dlvr_dt AS doc_dt,
             i.inv_tot_amt * IF(i.curr_cd = 'CAD', fx.fx_rt, 1) AS amt_usd
      FROM bil_cust_inv i
      JOIN dlv d USING (load_id)
      LEFT JOIN fx ON fx.eff_mo_dt = DATE_TRUNC(i.inv_dt, MONTH)
      UNION ALL
      SELECT c.load_id, d.dlvr_dt, -c.cr_amt * IF(c.curr_cd = 'CAD', fx.fx_rt, 1)
      FROM bil_cr_memo c
      JOIN dlv d USING (load_id)
      LEFT JOIN fx ON fx.eff_mo_dt = DATE_TRUNC(c.cr_dt, MONTH)
      UNION ALL
      SELECT f.load_id, f.fee_dt, f.cust_fee_amt * IF(f.curr_cd = 'CAD', fx.fx_rt, 1)
      FROM bil_canc_fee f
      LEFT JOIN fx ON fx.eff_mo_dt = DATE_TRUNC(f.fee_dt, MONTH)
    ),
    cust AS (
      -- the customer is the parent account of the site that shipped
      SELECT h.load_id, p.acct_id AS cust_id, p.acct_nm AS cust_nm
      FROM tms_load_hdr h
      JOIN mdm_cust_acct s ON s.acct_id = h.shpr_acct_id
      JOIN mdm_cust_acct p ON p.acct_id = s.prnt_acct_id
    )
    SELECT c.cust_nm
    FROM rev_doc r JOIN cust c USING (load_id)
    WHERE r.doc_dt BETWEEN '2026-07-01' AND '2026-09-30'
    GROUP BY c.cust_nm
    ORDER BY SUM(r.amt_usd) DESC
    LIMIT 1
