- id: M1
  group: metric
  question: What was our on-time delivery rate in September 2026?
  answer_type: percent
  tolerance:
    kind: abs
    value: 0.5
  definitions:
  - on_time
  - delivered_load
  - local_time
  - load
  why: 'The official on-time rate is the contract measure: arrival at the final delivery stop at or before
    the end of the appointment window, on the destination''s clock, with late loads that the shipper delayed
    left out of the measure entirely.'
  gold_sql: |
    WITH final_dl AS (
      -- the last delivery stop of each load
      SELECT load_id, tz_nm, arr_ts, appt_end_lcl
      FROM tms_stop
      WHERE stop_typ_cd = 'DL'
      QUALIFY ROW_NUMBER() OVER (PARTITION BY load_id ORDER BY stop_seq DESC) = 1
    ),
    dlvd AS (
      -- real delivered loads, dated and judged on the clock at the destination
      SELECT h.load_id, h.shpr_acct_id, h.carr_id,
             DATE(f.arr_ts, f.tz_nm) AS dlvr_dt,
             DATETIME(f.arr_ts, f.tz_nm) <= f.appt_end_lcl AS on_time
      FROM tms_load_hdr h
      JOIN final_dl f USING (load_id)
      WHERE h.load_stat_cd = 'DLVD' AND NOT h.test_flg AND NOT h.void_flg
    ),
    shpr_delay AS (
      SELECT DISTINCT load_id FROM tms_stat_evt WHERE evt_cd = 'DLAY' AND rsn_cd = 'SHPR'
    )
    SELECT ROUND(100 * COUNTIF(d.on_time) / COUNTIF(d.on_time OR x.load_id IS NULL), 2)
    FROM dlvd d
    LEFT JOIN shpr_delay x USING (load_id)
    WHERE d.dlvr_dt BETWEEN '2026-09-01' AND '2026-09-30'
  decoys:
  - label: 'operations definition: in the window, shipper-caused lates still counted'
    sql: |
      WITH final_dl AS (
        -- the last delivery stop of each load
        SELECT load_id, tz_nm, arr_ts, appt_end_lcl
        FROM tms_stop
        WHERE stop_typ_cd = 'DL'
        QUALIFY ROW_NUMBER() OVER (PARTITION BY load_id ORDER BY stop_seq DESC) = 1
      ),
      dlvd AS (
        -- real delivered loads, dated and judged on the clock at the destination
        SELECT h.load_id, h.shpr_acct_id, h.carr_id,
               DATE(f.arr_ts, f.tz_nm) AS dlvr_dt,
               DATETIME(f.arr_ts, f.tz_nm) <= f.appt_end_lcl AS on_time
        FROM tms_load_hdr h
        JOIN final_dl f USING (load_id)
        WHERE h.load_stat_cd = 'DLVD' AND NOT h.test_flg AND NOT h.void_flg
      )
      SELECT ROUND(100 * COUNTIF(on_time) / COUNT(*), 2) FROM dlvd WHERE dlvr_dt BETWEEN '2026-09-01' AND '2026-09-30'
  - label: 'portal definition: delivered by the requested date'
    sql: |
      SELECT ROUND(100 * COUNTIF(on_time_ind = 'Y') / COUNT(*), 2)
      FROM ptl_shpmt WHERE actl_dlvr_dt BETWEEN '2026-09-01' AND '2026-09-30'
  - label: UTC arrival compared with the local appointment as if both were UTC
    sql: |
      WITH final_dl AS (
        -- the last delivery stop of each load
        SELECT load_id, tz_nm, arr_ts, appt_end_lcl
        FROM tms_stop
        WHERE stop_typ_cd = 'DL'
        QUALIFY ROW_NUMBER() OVER (PARTITION BY load_id ORDER BY stop_seq DESC) = 1
      ),
      dlvd AS (
        -- real delivered loads, dated and judged on the clock at the destination
        SELECT h.load_id, h.shpr_acct_id, h.carr_id,
               DATE(f.arr_ts, f.tz_nm) AS dlvr_dt,
               DATETIME(f.arr_ts, f.tz_nm) <= f.appt_end_lcl AS on_time
        FROM tms_load_hdr h
        JOIN final_dl f USING (load_id)
        WHERE h.load_stat_cd = 'DLVD' AND NOT h.test_flg AND NOT h.void_flg
      )
      SELECT ROUND(100 * COUNTIF(f.arr_ts <= TIMESTAMP(f.appt_end_lcl)) / COUNT(*), 2)
      FROM dlvd d JOIN final_dl f USING (load_id)
      WHERE DATE(f.arr_ts) BETWEEN '2026-09-01' AND '2026-09-30'

- id: M2
  group: metric
  question: What was our total revenue in Q3 2026?
  answer_type: money
  tolerance:
    kind: rel
    value: 0.01
  definitions:
  - revenue
  - currency
  - billable
  why: Revenue is what was invoiced in the period, less credit memos, plus canceled-load fees, in US dollars.
    Linehaul on the load record is only part of it, and the load table also holds canceled, test, voided
    and re-tendered rows that were never billed.
  gold_sql: |
    WITH fx AS (
      SELECT eff_mo_dt, fx_rt FROM ref_fx_rate
      WHERE from_curr_cd = 'CAD' AND to_curr_cd = 'USD'
    ),
    rev_doc AS (
      -- invoices, less credit memos, plus canceled-load fees, each in US dollars
      -- at the rate for the month of the document
      SELECT i.load_id, i.inv_dt AS doc_dt,
             i.inv_tot_amt * IF(i.curr_cd = 'CAD', fx.fx_rt, 1) AS amt_usd
      FROM bil_cust_inv i
      LEFT JOIN fx ON fx.eff_mo_dt = DATE_TRUNC(i.inv_dt, MONTH)
      UNION ALL
      SELECT c.load_id, c.cr_dt, -c.cr_amt * IF(c.curr_cd = 'CAD', fx.fx_rt, 1)
      FROM bil_cr_memo c
      LEFT JOIN fx ON fx.eff_mo_dt = DATE_TRUNC(c.cr_dt, MONTH)
      UNION ALL
      SELECT f.load_id, f.fee_dt, f.cust_fee_amt * IF(f.curr_cd = 'CAD', fx.fx_rt, 1)
      FROM bil_canc_fee f
      LEFT JOIN fx ON fx.eff_mo_dt = DATE_TRUNC(f.fee_dt, MONTH)
    )
    SELECT ROUND(SUM(amt_usd), 2) FROM rev_doc WHERE doc_dt BETWEEN '2026-07-01' AND '2026-09-30'
  decoys:
  - label: linehaul on every load row created in the quarter
    sql: |
      SELECT ROUND(SUM(lh_rev_amt), 2) FROM tms_load_hdr WHERE DATE(crt_ts) BETWEEN '2026-07-01' AND '2026-09-30'
  - label: linehaul on delivered load rows, by UTC delivery date, test loads included
    sql: |
      SELECT ROUND(SUM(h.lh_rev_amt), 2)
      FROM tms_load_hdr h
      JOIN tms_stat_evt e ON e.load_id = h.load_id AND e.evt_cd = 'DLVD'
      WHERE DATE(e.evt_ts) BETWEEN '2026-07-01' AND '2026-09-30'
  - label: invoice totals with Canadian dollars added in as if they were US dollars
    sql: |
      SELECT ROUND(SUM(inv_tot_amt), 2) FROM bil_cust_inv WHERE inv_dt BETWEEN '2026-07-01' AND '2026-09-30'

- id: M3
  group: metric
  question: What was our average margin per load in Q3 2026?
  answer_type: money
  tolerance:
    kind: rel
    value: 0.01
  definitions:
  - margin
  - revenue
  - currency
  - billable
  why: 'Margin is revenue less everything paid to carriers on the same loads: linehaul, fuel surcharge,
    accessorials and canceled-load fees, in US dollars, divided by the loads invoiced in the period. Linehaul
    revenue minus linehaul cost leaves out four tables.'
  gold_sql: |
    WITH fx AS (
      SELECT eff_mo_dt, fx_rt FROM ref_fx_rate
      WHERE from_curr_cd = 'CAD' AND to_curr_cd = 'USD'
    ),
    rev_doc AS (
      -- invoices, less credit memos, plus canceled-load fees, each in US dollars
      -- at the rate for the month of the document
      SELECT i.load_id, i.inv_dt AS doc_dt,
             i.inv_tot_amt * IF(i.curr_cd = 'CAD', fx.fx_rt, 1) AS amt_usd
      FROM bil_cust_inv i
      LEFT JOIN fx ON fx.eff_mo_dt = DATE_TRUNC(i.inv_dt, MONTH)
      UNION ALL
      SELECT c.load_id, c.cr_dt, -c.cr_amt * IF(c.curr_cd = 'CAD', fx.fx_rt, 1)
      FROM bil_cr_memo c
      LEFT JOIN fx ON fx.eff_mo_dt = DATE_TRUNC(c.cr_dt, MONTH)
      UNION ALL
      SELECT f.load_id, f.fee_dt, f.cust_fee_amt * IF(f.curr_cd = 'CAD', fx.fx_rt, 1)
      FROM bil_canc_fee f
      LEFT JOIN fx ON fx.eff_mo_dt = DATE_TRUNC(f.fee_dt, MONTH)
    ),
    cost_doc AS (
      -- what the carrier was paid for each invoiced load: linehaul, fuel and
      -- accessorials, plus the carrier's share of canceled-load fees
      SELECT i.load_id, i.inv_dt AS doc_dt,
             (p.lh_pay_amt + s.carr_fsc_amt + IFNULL(a.carr_accsrl_amt, 0))
               * IF(i.curr_cd = 'CAD', fx.fx_rt, 1) AS amt_usd
      FROM bil_cust_inv i
      JOIN bil_carr_pay p USING (load_id)
      JOIN bil_fuel_schg s USING (load_id)
      LEFT JOIN (
        SELECT load_id, SUM(carr_pay_amt) AS carr_accsrl_amt
        FROM bil_accsrl_chrg GROUP BY load_id
      ) a USING (load_id)
      LEFT JOIN fx ON fx.eff_mo_dt = DATE_TRUNC(i.inv_dt, MONTH)
      UNION ALL
      SELECT f.load_id, f.fee_dt, f.carr_fee_amt * IF(f.curr_cd = 'CAD', fx.fx_rt, 1)
      FROM bil_canc_fee f
      LEFT JOIN fx ON fx.eff_mo_dt = DATE_TRUNC(f.fee_dt, MONTH)
    )
    SELECT ROUND(
      ((SELECT SUM(amt_usd) FROM rev_doc WHERE doc_dt BETWEEN '2026-07-01' AND '2026-09-30')
       - (SELECT SUM(amt_usd) FROM cost_doc WHERE doc_dt BETWEEN '2026-07-01' AND '2026-09-30'))
      / (SELECT COUNT(*) FROM bil_cust_inv WHERE inv_dt BETWEEN '2026-07-01' AND '2026-09-30'), 2)
  decoys:
  - label: linehaul revenue minus linehaul cost, averaged over every load row created in the quarter
    sql: |
      SELECT ROUND(AVG(lh_rev_amt - lh_cost_amt), 2)
      FROM tms_load_hdr WHERE DATE(crt_ts) BETWEEN '2026-07-01' AND '2026-09-30'
  - label: linehaul revenue minus linehaul cost on delivered load rows
    sql: |
      SELECT ROUND(AVG(h.lh_rev_amt - h.lh_cost_amt), 2)
      FROM tms_load_hdr h
      JOIN tms_stat_evt e ON e.load_id = h.load_id AND e.evt_cd = 'DLVD'
      WHERE DATE(e.evt_ts) BETWEEN '2026-07-01' AND '2026-09-30'
  - label: invoice total minus carrier linehaul pay
    sql: |
      SELECT ROUND(AVG(i.inv_tot_amt - p.lh_pay_amt), 2)
      FROM bil_cust_inv i JOIN bil_carr_pay p USING (load_id)
      WHERE i.inv_dt BETWEEN '2026-07-01' AND '2026-09-30'

- id: M4
  group: metric
  question: What was our margin percentage in Q3 2026?
  answer_type: percent
  tolerance:
    kind: abs
    value: 0.5
  definitions:
  - margin
  - revenue
  - currency
  - billable
  why: Margin percentage is net margin over revenue for the period, both on the official definitions.
    Fuel and accessorials are mostly passed through to carriers, so they add revenue without adding much
    margin, and credits come straight off the top.
  gold_sql: |
    WITH fx AS (
      SELECT eff_mo_dt, fx_rt FROM ref_fx_rate
      WHERE from_curr_cd = 'CAD' AND to_curr_cd = 'USD'
    ),
    rev_doc AS (
      -- invoices, less credit memos, plus canceled-load fees, each in US dollars
      -- at the rate for the month of the document
      SELECT i.load_id, i.inv_dt AS doc_dt,
             i.inv_tot_amt * IF(i.curr_cd = 'CAD', fx.fx_rt, 1) AS amt_usd
      FROM bil_cust_inv i
      LEFT JOIN fx ON fx.eff_mo_dt = DATE_TRUNC(i.inv_dt, MONTH)
      UNION ALL
      SELECT c.load_id, c.cr_dt, -c.cr_amt * IF(c.curr_cd = 'CAD', fx.fx_rt, 1)
      FROM bil_cr_memo c
      LEFT JOIN fx ON fx.eff_mo_dt = DATE_TRUNC(c.cr_dt, MONTH)
      UNION ALL
      SELECT f.load_id, f.fee_dt, f.cust_fee_amt * IF(f.curr_cd = 'CAD', fx.fx_rt, 1)
      FROM bil_canc_fee f
      LEFT JOIN fx ON fx.eff_mo_dt = DATE_TRUNC(f.fee_dt, MONTH)
    ),
    cost_doc AS (
      -- what the carrier was paid for each invoiced load: linehaul, fuel and
      -- accessorials, plus the carrier's share of canceled-load fees
      SELECT i.load_id, i.inv_dt AS doc_dt,
             (p.lh_pay_amt + s.carr_fsc_amt + IFNULL(a.carr_accsrl_amt, 0))
               * IF(i.curr_cd = 'CAD', fx.fx_rt, 1) AS amt_usd
      FROM bil_cust_inv i
      JOIN bil_carr_pay p USING (load_id)
      JOIN bil_fuel_schg s USING (load_id)
      LEFT JOIN (
        SELECT load_id, SUM(carr_pay_amt) AS carr_accsrl_amt
        FROM bil_accsrl_chrg GROUP BY load_id
      ) a USING (load_id)
      LEFT JOIN fx ON fx.eff_mo_dt = DATE_TRUNC(i.inv_dt, MONTH)
      UNION ALL
      SELECT f.load_id, f.fee_dt, f.carr_fee_amt * IF(f.curr_cd = 'CAD', fx.fx_rt, 1)
      FROM bil_canc_fee f
      LEFT JOIN fx ON fx.eff_mo_dt = DATE_TRUNC(f.fee_dt, MONTH)
    )
    SELECT ROUND(100 *
      ((SELECT SUM(amt_usd) FROM rev_doc WHERE doc_dt BETWEEN '2026-07-01' AND '2026-09-30')
       - (SELECT SUM(amt_usd) FROM cost_doc WHERE doc_dt BETWEEN '2026-07-01' AND '2026-09-30'))
      / (SELECT SUM(amt_usd) FROM rev_doc WHERE doc_dt BETWEEN '2026-07-01' AND '2026-09-30'), 2)
  decoys:
  - label: linehaul margin over linehaul revenue on every load row created in the quarter
    sql: |
      SELECT ROUND(100 * SUM(lh_rev_amt - lh_cost_amt) / SUM(lh_rev_amt), 2)
      FROM tms_load_hdr WHERE DATE(crt_ts) BETWEEN '2026-07-01' AND '2026-09-30'
  - label: invoice total minus carrier linehaul pay, over invoice total
    sql: |
      SELECT ROUND(100 * SUM(i.inv_tot_amt - p.lh_pay_amt) / SUM(i.inv_tot_amt), 2)
      FROM bil_cust_inv i JOIN bil_carr_pay p USING (load_id)
      WHERE i.inv_dt BETWEEN '2026-07-01' AND '2026-09-30'

- id: M5
  group: metric
  question: How many loads did we deliver in September 2026?
  answer_type: number
  tolerance:
    kind: exact
  definitions:
  - delivered_load
  - load
  - local_time
  why: A delivered load is a real load with a delivered status, counted once, in the month of its arrival
    at the final stop on the destination's clock. Test loads carry a delivered status too and do not count.
  gold_sql: |
    WITH final_dl AS (
      -- the last delivery stop of each load
      SELECT load_id, tz_nm, arr_ts, appt_end_lcl
      FROM tms_stop
      WHERE stop_typ_cd = 'DL'
      QUALIFY ROW_NUMBER() OVER (PARTITION BY load_id ORDER BY stop_seq DESC) = 1
    ),
    dlvd AS (
      -- real delivered loads, dated and judged on the clock at the destination
      SELECT h.load_id, h.shpr_acct_id, h.carr_id,
             DATE(f.arr_ts, f.tz_nm) AS dlvr_dt,
             DATETIME(f.arr_ts, f.tz_nm) <= f.appt_end_lcl AS on_time
      FROM tms_load_hdr h
      JOIN final_dl f USING (load_id)
      WHERE h.load_stat_cd = 'DLVD' AND NOT h.test_flg AND NOT h.void_flg
    )
    SELECT COUNT(*) FROM dlvd WHERE dlvr_dt BETWEEN '2026-09-01' AND '2026-09-30'
  decoys:
  - label: delivered status events in the month by UTC date, test loads included
    sql: |
      SELECT COUNT(*) FROM tms_stat_evt WHERE evt_cd = 'DLVD' AND DATE(evt_ts) BETWEEN '2026-09-01' AND '2026-09-30'
  - label: invoices dated in the month
    sql: |
      SELECT COUNT(*) FROM bil_cust_inv WHERE inv_dt BETWEEN '2026-09-01' AND '2026-09-30'
  - label: portal shipments shown delivered in the month
    sql: |
      SELECT COUNT(*) FROM ptl_shpmt WHERE actl_dlvr_dt BETWEEN '2026-09-01' AND '2026-09-30'

- id: M6
  group: metric
  question: How many loads did our own fleet deliver in Q3 2026?
  answer_type: number
  tolerance:
    kind: exact
  definitions:
  - delivered_load
  - load
  - local_time
  why: Delivered loads, on the official definition, hauled by the carrier row that is Tessaway's own fleet.
  gold_sql: |
    WITH final_dl AS (
      -- the last delivery stop of each load
      SELECT load_id, tz_nm, arr_ts, appt_end_lcl
      FROM tms_stop
      WHERE stop_typ_cd = 'DL'
      QUALIFY ROW_NUMBER() OVER (PARTITION BY load_id ORDER BY stop_seq DESC) = 1
    ),
    dlvd AS (
      -- real delivered loads, dated and judged on the clock at the destination
      SELECT h.load_id, h.shpr_acct_id, h.carr_id,
             DATE(f.arr_ts, f.tz_nm) AS dlvr_dt,
             DATETIME(f.arr_ts, f.tz_nm) <= f.appt_end_lcl AS on_time
      FROM tms_load_hdr h
      JOIN final_dl f USING (load_id)
      WHERE h.load_stat_cd = 'DLVD' AND NOT h.test_flg AND NOT h.void_flg
    )
    SELECT COUNT(*)
    FROM dlvd d JOIN tms_carr c USING (carr_id)
    WHERE c.carr_typ_cd = 'OWN' AND d.dlvr_dt BETWEEN '2026-07-01' AND '2026-09-30'
  decoys:
  - label: fleet load rows created in the quarter, whatever became of them
    sql: |
      SELECT COUNT(*) FROM tms_load_hdr h JOIN tms_carr c USING (carr_id)
      WHERE c.carr_typ_cd = 'OWN' AND DATE(h.crt_ts) BETWEEN '2026-07-01' AND '2026-09-30'

- id: E1
  group: entity
  question: Who was our largest customer by revenue in Q3 2026?
  answer_type: text
  tolerance:
    kind: exact
  definitions:
  - customer
  - revenue
  - currency
  why: The customer is the parent account. Revenue rolls up from every site that ships under it, whatever
    the site is called and whoever receives the invoice. The largest single shipping site and the largest
    bill-to party are both different rows.
  gold_sql: |
    WITH fx AS (
      SELECT eff_mo_dt, fx_rt FROM ref_fx_rate
      WHERE from_curr_cd = 'CAD' AND to_curr_cd = 'USD'
    ),
    rev_doc AS (
      -- invoices, less credit memos, plus canceled-load fees, each in US dollars
      -- at the rate for the month of the document
      SELECT i.load_id, i.inv_dt AS doc_dt,
             i.inv_tot_amt * IF(i.curr_cd = 'CAD', fx.fx_rt, 1) AS amt_usd
      FROM bil_cust_inv i
      LEFT JOIN fx ON fx.eff_mo_dt = DATE_TRUNC(i.inv_dt, MONTH)
      UNION ALL
      SELECT c.load_id, c.cr_dt, -c.cr_amt * IF(c.curr_cd = 'CAD', fx.fx_rt, 1)
      FROM bil_cr_memo c
      LEFT JOIN fx ON fx.eff_mo_dt = DATE_TRUNC(c.cr_dt, MONTH)
      UNION ALL
      SELECT f.load_id, f.fee_dt, f.cust_fee_amt * IF(f.curr_cd = 'CAD', fx.fx_rt, 1)
      FROM bil_canc_fee f
      LEFT JOIN fx ON fx.eff_mo_dt = DATE_TRUNC(f.fee_dt, MONTH)
    ),
    cust AS (
      -- the customer is the parent account of the site that shipped
      SELECT h.load_id, p.acct_id AS cust_id, p.acct_nm AS cust_nm
      FROM tms_load_hdr h
      JOIN mdm_cust_acct s ON s.acct_id = h.shpr_acct_id
      JOIN mdm_cust_acct p ON p.acct_id = s.prnt_acct_id
    )
    SELECT c.cust_nm
    FROM rev_doc r JOIN cust c USING (load_id)
    WHERE r.doc_dt BETWEEN '2026-07-01' AND '2026-09-30'
    GROUP BY c.cust_nm
    ORDER BY SUM(r.amt_usd) DESC
    LIMIT 1
  accept:
  - Northgate Foods Group
  - Northgate Foods
  reject:
  - Joliet
  - Allentown
  - Reno
  - Brampton
  - Canada
  - AP Shared Services
  decoys:
  - label: largest bill-to party on invoices
    sql: |
      SELECT a.acct_nm
      FROM bil_cust_inv i JOIN mdm_cust_acct a ON a.acct_id = i.bill_to_acct_id
      WHERE i.inv_dt BETWEEN '2026-07-01' AND '2026-09-30'
      GROUP BY a.acct_nm ORDER BY SUM(i.inv_tot_amt) DESC LIMIT 1
  - label: largest shipper account row
    sql: |
      SELECT a.acct_nm
      FROM bil_cust_inv i
      JOIN tms_load_hdr h USING (load_id)
      JOIN mdm_cust_acct a ON a.acct_id = h.shpr_acct_id
      WHERE i.inv_dt BETWEEN '2026-07-01' AND '2026-09-30'
      GROUP BY a.acct_nm ORDER BY SUM(i.inv_tot_amt) DESC LIMIT 1
  - label: parent of the bill-to party
    sql: |
