- id: E3
  group: entity
  question: How much revenue did Northgate Foods bring in during Q3 2026?
  answer_type: money
  tolerance:
    kind: rel
    value: 0.01
  definitions:
  - customer
  - revenue
  - currency
  why: Northgate Foods is the parent account Northgate Foods Group. Its revenue includes sites that do
    not carry the Northgate name, and one site is invoiced to a different bill-to party. One site ships
    from Canada, partly in Canadian dollars.
  gold_sql: |
    WITH fx AS (
      SELECT eff_mo_dt, fx_rt FROM ref_fx_rate
      WHERE from_curr_cd = 'CAD' AND to_curr_cd = 'USD'
    ),
    rev_doc AS (
      -- invoices, less credit memos, plus canceled-load fees, each in US dollars
      -- at the rate for the month of the document
      SELECT i.load_id, i.inv_dt AS doc_dt,
             i.inv_tot_amt * IF(i.curr_cd = 'CAD', fx.fx_rt, 1) AS amt_usd
      FROM bil_cust_inv i
      LEFT JOIN fx ON fx.eff_mo_dt = DATE_TRUNC(i.inv_dt, MONTH)
      UNION ALL
      SELECT c.load_id, c.cr_dt, -c.cr_amt * IF(c.curr_cd = 'CAD', fx.fx_rt, 1)
      FROM bil_cr_memo c
      LEFT JOIN fx ON fx.eff_mo_dt = DATE_TRUNC(c.cr_dt, MONTH)
      UNION ALL
      SELECT f.load_id, f.fee_dt, f.cust_fee_amt * IF(f.curr_cd = 'CAD', fx.fx_rt, 1)
      FROM bil_canc_fee f
      LEFT JOIN fx ON fx.eff_mo_dt = DATE_TRUNC(f.fee_dt, MONTH)
    ),
    cust AS (
      -- the customer is the parent account of the site that shipped
      SELECT h.load_id, p.acct_id AS cust_id, p.acct_nm AS cust_nm
      FROM tms_load_hdr h
      JOIN mdm_cust_acct s ON s.acct_id = h.shpr_acct_id
      JOIN mdm_cust_acct p ON p.acct_id = s.prnt_acct_id
    )
    SELECT ROUND(SUM(r.amt_usd), 2)
    FROM rev_doc r JOIN cust c USING (load_id)
    WHERE c.cust_nm = 'Northgate Foods Group' AND r.doc_dt BETWEEN '2026-07-01' AND '2026-09-30'
  decoys:
  - label: only shipper accounts with Northgate in the name
    sql: |
      SELECT ROUND(SUM(i.inv_tot_amt), 2)
      FROM bil_cust_inv i
      JOIN tms_load_hdr h USING (load_id)
      JOIN mdm_cust_acct a ON a.acct_id = h.shpr_acct_id
      WHERE a.acct_nm LIKE '%Northgate%' AND i.inv_dt BETWEEN '2026-07-01' AND '2026-09-30'
  - label: only invoices sent to bill-to parties with Northgate in the name
    sql: |
      SELECT ROUND(SUM(i.inv_tot_amt), 2)
      FROM bil_cust_inv i
      JOIN mdm_cust_acct a ON a.acct_id = i.bill_to_acct_id
      WHERE a.acct_nm LIKE '%Northgate%' AND i.inv_dt BETWEEN '2026-07-01' AND '2026-09-30'
  - label: the whole parent, invoice totals with no currency conversion or credits
    sql: |
      WITH cust AS (
        -- the customer is the parent account of the site that shipped
        SELECT h.load_id, p.acct_id AS cust_id, p.acct_nm AS cust_nm
        FROM tms_load_hdr h
        JOIN mdm_cust_acct s ON s.acct_id = h.shpr_acct_id
        JOIN mdm_cust_acct p ON p.acct_id = s.prnt_acct_id
      )
      SELECT ROUND(SUM(i.inv_tot_amt), 2)
      FROM bil_cust_inv i JOIN cust c USING (load_id)
      WHERE c.cust_nm = 'Northgate Foods Group' AND i.inv_dt BETWEEN '2026-07-01' AND '2026-09-30'
  - label: linehaul on load rows for shippers with Northgate in the name
    sql: |
      SELECT ROUND(SUM(h.lh_rev_amt), 2)
      FROM tms_load_hdr h JOIN mdm_cust_acct a ON a.acct_id = h.shpr_acct_id
      WHERE a.acct_nm LIKE '%Northgate%' AND DATE(h.crt_ts) BETWEEN '2026-07-01' AND '2026-09-30'

- id: E4
  group: entity
  question: How many loads did we book in September 2026?
  answer_type: number
  tolerance:
    kind: rel
    value: 0.005
  definitions:
  - load
  why: A load is one shipment, counted once from its first tender. A re-tender adds a second row for the
    same shipment, and test and voided rows are not loads at all.
  gold_sql: |
    SELECT COUNT(*)
    FROM tms_load_hdr
    WHERE orig_load_id IS NULL AND NOT test_flg AND NOT void_flg
      AND DATE(crt_ts) BETWEEN '2026-09-01' AND '2026-09-30'
  decoys:
  - label: every row in the load table
    sql: |
      SELECT COUNT(*) FROM tms_load_hdr WHERE DATE(crt_ts) BETWEEN '2026-09-01' AND '2026-09-30'
  - label: test and voided rows removed, re-tenders still counted twice
    sql: |
      SELECT COUNT(*) FROM tms_load_hdr
      WHERE NOT test_flg AND NOT void_flg AND DATE(crt_ts) BETWEEN '2026-09-01' AND '2026-09-30'

