      JOIN mdm_cust_acct a ON a.acct_id = i.bill_to_acct_id
      JOIN mdm_cust_acct p ON p.acct_id = a.prnt_acct_id
      WHERE i.inv_dt BETWEEN '2026-07-01' AND '2026-09-30'
