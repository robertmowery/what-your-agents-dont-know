- id: R1
  group: rule
  question: How many of our September 2026 deliveries were late?
  answer_type: number
  tolerance:
    kind: exact
  definitions:
  - on_time
  - delivered_load
  - local_time
  - load
  why: Late means arrival after the end of the appointment window on the destination's clock. Under the
    contract rule, a late load that the shipper delayed is left out of the measure, so it is not counted
    as late.
  gold_sql: |
    WITH final_dl AS (
      -- the last delivery stop of each load
      SELECT load_id, tz_nm, arr_ts, appt_end_lcl
      FROM tms_stop
      WHERE stop_typ_cd = 'DL'
      QUALIFY ROW_NUMBER() OVER (PARTITION BY load_id ORDER BY stop_seq DESC) = 1
    ),
    dlvd AS (
      -- real delivered loads, dated and judged on the clock at the destination
      SELECT h.load_id, h.shpr_acct_id, h.carr_id,
             DATE(f.arr_ts, f.tz_nm) AS dlvr_dt,
             DATETIME(f.arr_ts, f.tz_nm) <= f.appt_end_lcl AS on_time
      FROM tms_load_hdr h
      JOIN final_dl f USING (load_id)
      WHERE h.load_stat_cd = 'DLVD' AND NOT h.test_flg AND NOT h.void_flg
    ),
    shpr_delay AS (
      SELECT DISTINCT load_id FROM tms_stat_evt WHERE evt_cd = 'DLAY' AND rsn_cd = 'SHPR'
    )
    SELECT COUNT(*)
    FROM dlvd d
    LEFT JOIN shpr_delay x USING (load_id)
    WHERE NOT d.on_time AND x.load_id IS NULL AND d.dlvr_dt BETWEEN '2026-09-01' AND '2026-09-30'
  decoys:
  - label: every load that missed its window, shipper-caused or not
    sql: |
      WITH final_dl AS (
        -- the last delivery stop of each load
        SELECT load_id, tz_nm, arr_ts, appt_end_lcl
        FROM tms_stop
        WHERE stop_typ_cd = 'DL'
        QUALIFY ROW_NUMBER() OVER (PARTITION BY load_id ORDER BY stop_seq DESC) = 1
      ),
      dlvd AS (
        -- real delivered loads, dated and judged on the clock at the destination
        SELECT h.load_id, h.shpr_acct_id, h.carr_id,
               DATE(f.arr_ts, f.tz_nm) AS dlvr_dt,
               DATETIME(f.arr_ts, f.tz_nm) <= f.appt_end_lcl AS on_time
        FROM tms_load_hdr h
        JOIN final_dl f USING (load_id)
        WHERE h.load_stat_cd = 'DLVD' AND NOT h.test_flg AND NOT h.void_flg
      )
      SELECT COUNT(*) FROM dlvd WHERE NOT on_time AND dlvr_dt BETWEEN '2026-09-01' AND '2026-09-30'
  - label: 'portal definition: delivered after the requested date'
    sql: |
      SELECT COUNT(*) FROM ptl_shpmt WHERE on_time_ind = 'N' AND actl_dlvr_dt BETWEEN '2026-09-01' AND '2026-09-30'
  - label: UTC arrival compared with the local appointment as if both were UTC
    sql: |
      WITH final_dl AS (
        -- the last delivery stop of each load
        SELECT load_id, tz_nm, arr_ts, appt_end_lcl
        FROM tms_stop
        WHERE stop_typ_cd = 'DL'
        QUALIFY ROW_NUMBER() OVER (PARTITION BY load_id ORDER BY stop_seq DESC) = 1
      ),
      dlvd AS (
        -- real delivered loads, dated and judged on the clock at the destination
        SELECT h.load_id, h.shpr_acct_id, h.carr_id,
               DATE(f.arr_ts, f.tz_nm) AS dlvr_dt,
               DATETIME(f.arr_ts, f.tz_nm) <= f.appt_end_lcl AS on_time
        FROM tms_load_hdr h
        JOIN final_dl f USING (load_id)
        WHERE h.load_stat_cd = 'DLVD' AND NOT h.test_flg AND NOT h.void_flg
      )
      SELECT COUNTIF(f.arr_ts > TIMESTAMP(f.appt_end_lcl))
      FROM dlvd d JOIN final_dl f USING (load_id)
      WHERE DATE(f.arr_ts) BETWEEN '2026-09-01' AND '2026-09-30'

- id: R2
  group: rule
  question: How many loads delivered in September 2026 are we still unable to bill?
  answer_type: number
  tolerance:
    kind: exact
  definitions:
  - billable
  - delivered_load
  - load
  - local_time
  why: Billing waits for a signed proof of delivery. A delivered load with no proof of delivery, or only
    an unsigned one, cannot be invoiced. Test loads are never billed and are not waiting for anything.
  gold_sql: |
    WITH final_dl AS (
      -- the last delivery stop of each load
      SELECT load_id, tz_nm, arr_ts, appt_end_lcl
      FROM tms_stop
      WHERE stop_typ_cd = 'DL'
      QUALIFY ROW_NUMBER() OVER (PARTITION BY load_id ORDER BY stop_seq DESC) = 1
    ),
    dlvd AS (
      -- real delivered loads, dated and judged on the clock at the destination
      SELECT h.load_id, h.shpr_acct_id, h.carr_id,
             DATE(f.arr_ts, f.tz_nm) AS dlvr_dt,
             DATETIME(f.arr_ts, f.tz_nm) <= f.appt_end_lcl AS on_time
      FROM tms_load_hdr h
      JOIN final_dl f USING (load_id)
      WHERE h.load_stat_cd = 'DLVD' AND NOT h.test_flg AND NOT h.void_flg
    )
    SELECT COUNT(*)
    FROM dlvd d
    WHERE d.dlvr_dt BETWEEN '2026-09-01' AND '2026-09-30'
      AND NOT EXISTS (
        SELECT 1 FROM bil_pod_doc p WHERE p.load_id = d.load_id AND p.signed_flg)
  decoys:
  - label: delivered load rows with no invoice, test loads included
    sql: |
      SELECT COUNT(*)
      FROM tms_load_hdr h
      JOIN tms_stat_evt e ON e.load_id = h.load_id AND e.evt_cd = 'DLVD'
      WHERE DATE(e.evt_ts) BETWEEN '2026-09-01' AND '2026-09-30'
        AND NOT EXISTS (SELECT 1 FROM bil_cust_inv i WHERE i.load_id = h.load_id)
  - label: no proof of delivery document of any kind, signed or not
    sql: |
      WITH final_dl AS (
        -- the last delivery stop of each load
        SELECT load_id, tz_nm, arr_ts, appt_end_lcl
        FROM tms_stop
        WHERE stop_typ_cd = 'DL'
        QUALIFY ROW_NUMBER() OVER (PARTITION BY load_id ORDER BY stop_seq DESC) = 1
      ),
      dlvd AS (
        -- real delivered loads, dated and judged on the clock at the destination
        SELECT h.load_id, h.shpr_acct_id, h.carr_id,
               DATE(f.arr_ts, f.tz_nm) AS dlvr_dt,
               DATETIME(f.arr_ts, f.tz_nm) <= f.appt_end_lcl AS on_time
        FROM tms_load_hdr h
        JOIN final_dl f USING (load_id)
        WHERE h.load_stat_cd = 'DLVD' AND NOT h.test_flg AND NOT h.void_flg
      )
      SELECT COUNT(*)
      FROM dlvd d
      WHERE d.dlvr_dt BETWEEN '2026-09-01' AND '2026-09-30'
        AND NOT EXISTS (SELECT 1 FROM bil_pod_doc p WHERE p.load_id = d.load_id)

