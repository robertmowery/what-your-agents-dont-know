      SELECT load_id, tz_nm, arr_ts, appt_end_lcl
      FROM tms_stop
      WHERE stop_typ_cd = 'DL'
      QUALIFY ROW_NUMBER() OVER (PARTITION BY load_id ORDER BY stop_seq DESC) = 1
    ),
    dlvd AS (
      -- real delivered loads, dated and judged on the clock at the destination
      SELECT h.load_id, h.shpr_acct_id, h.carr_id,
             DATE(f.arr_ts, f.tz_nm) AS dlvr_dt,
             DATETIME(f.arr_ts, f.tz_nm) <= f.appt_end_lcl AS on_time
      FROM tms_load_hdr h
      JOIN final_dl f USING (load_id)
      WHERE h.load_stat_cd = 'DLVD' AND NOT h.test_flg AND NOT h.void_flg
    )
    SELECT COUNT(*) FROM dlvd WHERE dlvr_dt = '2026-09-11'
  decoys:
  - label: UTC date of the arrival, test loads included
    sql: |
      SELECT COUNT(*)
      FROM tms_load_hdr h
      JOIN tms_stat_evt e ON e.load_id = h.load_id AND e.evt_cd = 'DLVD'
      WHERE DATE(e.evt_ts) = '2026-09-11'
  - label: UTC date of the arrival at the final stop, real loads only
    sql: |
      WITH final_dl AS (
        -- the last delivery stop of each load
        SELECT load_id, tz_nm, arr_ts, appt_end_lcl
        FROM tms_stop
        WHERE stop_typ_cd = 'DL'
        QUALIFY ROW_NUMBER() OVER (PARTITION BY load_id ORDER BY stop_seq DESC) = 1
      ),
      dlvd AS (
        -- real delivered loads, dated and judged on the clock at the destination
        SELECT h.load_id, h.shpr_acct_id, h.carr_id,
               DATE(f.arr_ts, f.tz_nm) AS dlvr_dt,
               DATETIME(f.arr_ts, f.tz_nm) <= f.appt_end_lcl AS on_time
        FROM tms_load_hdr h
        JOIN final_dl f USING (load_id)
        WHERE h.load_stat_cd = 'DLVD' AND NOT h.test_flg AND NOT h.void_flg
      )
      SELECT COUNT(*) FROM dlvd d JOIN final_dl f USING (load_id)
      WHERE DATE(f.arr_ts) = '2026-09-11'

- id: R5
  group: rule
  question: What on-time rate did our customers see in the portal for September 2026 deliveries?
  answer_type: percent
  tolerance:
    kind: abs
    value: 0.5
  definitions:
  - portal_on_time
  why: 'This question asks for the portal''s own measure, so the portal''s rule is the right one: delivered
    on or before the requested date. The operations and contract measures answer a different question.'
  gold_sql: |
    SELECT ROUND(100 * COUNTIF(on_time_ind = 'Y') / COUNT(*), 2)
    FROM ptl_shpmt
    WHERE actl_dlvr_dt BETWEEN '2026-09-01' AND '2026-09-30'
  decoys:
  - label: 'operations definition: arrival inside the appointment window'
    sql: |
      WITH final_dl AS (
        -- the last delivery stop of each load
        SELECT load_id, tz_nm, arr_ts, appt_end_lcl
        FROM tms_stop
        WHERE stop_typ_cd = 'DL'
        QUALIFY ROW_NUMBER() OVER (PARTITION BY load_id ORDER BY stop_seq DESC) = 1
      ),
      dlvd AS (
        -- real delivered loads, dated and judged on the clock at the destination
        SELECT h.load_id, h.shpr_acct_id, h.carr_id,
               DATE(f.arr_ts, f.tz_nm) AS dlvr_dt,
               DATETIME(f.arr_ts, f.tz_nm) <= f.appt_end_lcl AS on_time
        FROM tms_load_hdr h
        JOIN final_dl f USING (load_id)
        WHERE h.load_stat_cd = 'DLVD' AND NOT h.test_flg AND NOT h.void_flg
      )
      SELECT ROUND(100 * COUNTIF(on_time) / COUNT(*), 2) FROM dlvd WHERE dlvr_dt BETWEEN '2026-09-01' AND '2026-09-30'
  - label: 'contract definition: shipper-caused lates left out'
    sql: |
      WITH final_dl AS (
        -- the last delivery stop of each load
        SELECT load_id, tz_nm, arr_ts, appt_end_lcl
        FROM tms_stop
        WHERE stop_typ_cd = 'DL'
        QUALIFY ROW_NUMBER() OVER (PARTITION BY load_id ORDER BY stop_seq DESC) = 1
      ),
      dlvd AS (
        -- real delivered loads, dated and judged on the clock at the destination
        SELECT h.load_id, h.shpr_acct_id, h.carr_id,
               DATE(f.arr_ts, f.tz_nm) AS dlvr_dt,
               DATETIME(f.arr_ts, f.tz_nm) <= f.appt_end_lcl AS on_time
        FROM tms_load_hdr h
        JOIN final_dl f USING (load_id)
        WHERE h.load_stat_cd = 'DLVD' AND NOT h.test_flg AND NOT h.void_flg
      ),
      shpr_delay AS (
        SELECT DISTINCT load_id FROM tms_stat_evt WHERE evt_cd = 'DLAY' AND rsn_cd = 'SHPR'
      )
      SELECT ROUND(100 * COUNTIF(d.on_time) / COUNTIF(d.on_time OR x.load_id IS NULL), 2)
      FROM dlvd d LEFT JOIN shpr_delay x USING (load_id)
      WHERE d.dlvr_dt BETWEEN '2026-09-01' AND '2026-09-30'

- id: R6
  group: rule
  question: How much margin did we make on canceled loads in Q3 2026?
  answer_type: money
  tolerance:
    kind: rel
    value: 0.01
  definitions:
  - margin
  - revenue
  - currency
  - load
  why: 'A canceled load earns nothing but its canceled-load fee: what the customer was billed less what
    the carrier was paid, from the fee table, in US dollars, dated by the fee. The linehaul amounts still
    sitting on a canceled load row were never billed or paid.'
  gold_sql: |
    WITH fx AS (
      SELECT eff_mo_dt, fx_rt FROM ref_fx_rate
      WHERE from_curr_cd = 'CAD' AND to_curr_cd = 'USD'
    )
    SELECT ROUND(SUM((f.cust_fee_amt - f.carr_fee_amt) * IF(f.curr_cd = 'CAD', fx.fx_rt, 1)), 2)
    FROM bil_canc_fee f
    LEFT JOIN fx ON fx.eff_mo_dt = DATE_TRUNC(f.fee_dt, MONTH)
    WHERE f.fee_dt BETWEEN '2026-07-01' AND '2026-09-30'
  decoys:
  - label: linehaul revenue minus linehaul cost on canceled load rows
    sql: |
      SELECT ROUND(SUM(lh_rev_amt - lh_cost_amt), 2) FROM tms_load_hdr
      WHERE load_stat_cd = 'CANC' AND DATE(crt_ts) BETWEEN '2026-07-01' AND '2026-09-30'
  - label: canceled-load fees billed to customers, with nothing taken off for the carrier
    sql: |
      SELECT ROUND(SUM(cust_fee_amt), 2) FROM bil_canc_fee WHERE fee_dt BETWEEN '2026-07-01' AND '2026-09-30'
  - label: zero, on the view that a canceled load has no margin
    sql: |
      SELECT 0
