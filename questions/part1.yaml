# Part 1 question set: what an executive asks Tessaway Freight (a fictional company).
#
# Four groups of six: lookups with no trap, metric questions, questions about
# who or what something is, and rule questions.
#
# Each entry stores the question, its group, the hand-written SQL that produces
# the correct answer, a tolerance, the official definitions that decide it
# (data/DEFINITIONS.md), and why. "decoys" are plausible wrong readings with
# the SQL that produces each; the scorer uses them to name the mistake.
#
# Tolerances:
#   exact       the number or name must match; used for counts
#   rel 0.005   within half a percent; used for the one count whose date basis is not a planted trap
#   rel 0.01    money: within one percent
#   abs 0.5     rates: within half a percentage point
#
# Agents see only the "question" text. This file and the definitions were
# written before any agent ran and are not changed to fit results.

- id: L1
  group: lookup
  question: How many carriers do we have on file?
  answer_type: number
  tolerance:
    kind: exact
  definitions: []
  why: A plain count of the carrier table. No definition is needed.
  gold_sql: |
    SELECT COUNT(*) FROM tms_carr

